[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmemix"
version = "0.1.0"
description = "Query-aware evidence forests for long-term multimodal agent memory"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Paper = "https://arxiv.org/abs/2608.26983"
Source = "https://github.com/ligeng0197/graphmemix"
Mirror = "https://gitee.com/oking9/graph-memix"

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24", "pillow>=10", "pytesseract>=0.3.10"]
methods = [
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "sentence-transformers>=3",
  "torch>=2.5",
  "transformers>=4.51",
]

[project.scripts]
graphmemix = "mm_memory_bench.cli:main"
mmmb = "mm_memory_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
